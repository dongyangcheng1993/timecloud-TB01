name: Build FanchmWrt Timecloud

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@main

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gnutls-dev libelf-dev libssl-dev libncurses-dev \
            libtool-bin zlib1g-dev wget cpio unzip rsync file python3 python3-setuptools

      - name: Clone FanchmWrt
        run: |
          git clone -b fanchmwrt-25.12.4 --depth 1 https://github.com/fanchmwrt/fanchmwrt.git repo
          mv repo/* repo/.[!.]* . 2>/dev/null || true
          rmdir repo

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          make defconfig
          echo "=== 列出所有 DEVICE 符号 ==="
          grep -o 'CONFIG_TARGET_ramips_mt7621_DEVICE_[a-z0-9_]*' .config | sort -u || true
          echo "=== 写入 timecloud ==="
          sed -i 's/^CONFIG_TARGET_ramips_mt7621_DEVICE_.*=y/# & is not set/' .config
          echo 'CONFIG_TARGET_ramips_mt7621_DEVICE_thunder_timecloud=y' >> .config
          make defconfig
          echo "=== 验证 ==="
          grep -q 'CONFIG_TARGET_ramips_mt7621_DEVICE_thunder_timecloud=y' .config && echo "OK" || { echo "FAILED"; exit 1; }

      - name: Download
        run: make download -j$(nproc)

      - name: Build
        run: make -j$(nproc) V=s

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: timecloud-firmware
          path: bin/targets/ramips/mt7621/*.bin
