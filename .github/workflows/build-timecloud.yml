name: Build FanchmWrt Timecloud

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone FanchmWrt
        run: |
          git clone -b fanchmwrt-25.12.4 --depth 1 https://github.com/fanchmwrt/fanchmwrt.git .

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gnutls-dev libelf-dev libssl-dev libncurses-dev \
            libtool-bin zlib1g-dev wget cpio unzip rsync file python3 python3-setuptools

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          make defconfig
          echo "=== 修改前 ==="
          grep "^CONFIG_TARGET" .config || true
          # 取消 adslr_g7 的选中
          sed -i 's/^CONFIG_TARGET_ramips_mt7621_adslr_g7=y/# CONFIG_TARGET_ramips_mt7621_adslr_g7 is not set/' .config
          # 确保 timecloud 是唯一的选中项
          sed -i '/^CONFIG_TARGET_ramips_mt7621_thunder_timecloud=y/d' .config
          echo 'CONFIG_TARGET_ramips_mt7621_thunder_timecloud=y' >> .config
          make defconfig
          echo "=== 修改后 ==="
          grep "thunder_timecloud" .config && echo "OK: timecloud selected" || { echo "ERROR: timecloud NOT selected!"; exit 1; }
          grep "adslr" .config && echo "WARN: adslr still present" || echo "OK: adslr removed"

      - name: Download
        run: make download -j$(nproc)

      - name: Build
        run: make -j$(nproc) V=s

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: timecloud-firmware
          path: bin/targets/ramips/mt7621/*.bin
