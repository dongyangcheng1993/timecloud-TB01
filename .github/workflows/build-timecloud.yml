name: Build FanchmWrt Timecloud

on:
  workflow_dispatch:
  push:
    tags: [ "build-*" ]

env:
  DEBIAN_FRONTEND: noninteractive
  FORCE_UNSAFE_CONFIGURE: 1
  CACHE_WARMUP: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gnutls-dev libelf-dev libssl-dev libncurses-dev libtool-bin \
            zlib1g-dev wget cpio unzip rsync file python3 python3-setuptools \
            device-tree-compiler libltdl-dev git curl ca-certificates ccache
          sudo /usr/sbin/update-alternatives --install /usr/bin/clang clang /usr/lib/ccache/clang 100
          ccache -M 5G

      - name: ccache
        uses: actions/cache@v4
        with:
          path: |
            ~/.ccache
            dl
          key: timecloud-${{ runner.os }}-${{ hashFiles('feeds.conf.default', 'include/**/*.mk', 'rules.mk') }}-${{ github.run_number }}
          restore-keys: |
            timecloud-${{ runner.os }}-

      - name: Clone FanchmWrt
        run: |
          git clone -b fanchmwrt-25.12.4 --depth 1 https://github.com/fanchmwrt/fanchmwrt.git src
          mv src/* src/.[!.]* . 2>/dev/null || true
          rm -rf src
          echo '--- HEAD ---'
          git rev-parse HEAD

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          echo '=== fwx 相关 feed（缺失则后续必败）==='
          ./scripts/feeds list -s | grep -Ei 'fwx|oaf|appfilter' || echo '!! 未找到 fwx feed'

      - name: Inject uci-defaults
        run: |
          mkdir -p files/etc/uci-defaults
          #!/bin/sh
          # 旁路由首次启动配置：LAN 静态 IP、关 DHCP、关 IPv6
          # 执行成功后由 /etc/uci-defaults 机制自动删除本文件
          set -e
          uci batch << 'UCI'
          set network.lan.proto='static'
          set network.lan.ipaddr='192.168.1.111'
          set network.lan.netmask='255.255.255.0'
          set network.lan.gateway='192.168.1.1'
          set network.lan.dns='192.168.1.1'
          set network.lan.dns_search=''
          set network.lan.ipv6='0'
          set dhcp.lan.ignore='1'
          set dhcp.lan.dhcpv6='disabled'
          set dhcp.lan.ra='disabled'
          commit network
          commit dhcp
          UCI
          # 立刻写入：启动早期 netifd 尚未就绪，供 ntp/opkg 等脚本使用
          echo "nameserver 192.168.1.1" > /etc/resolv.conf
          logger -t bypass-setup "LAN=192.168.1.111 gw=192.168.1.1 dhcpv6=disabled"
          exit 0
          chmod +x files/etc/uci-defaults/99-setup-bypass-router.sh
          ls -l files/etc/uci-defaults/

      - name: Configure
        run: |
          printf '%s\n' \
            'CONFIG_TARGET_ramips=y' \
            'CONFIG_TARGET_ramips_mt7621=y' \
            'CONFIG_TARGET_ramips_mt7621_DEVICE_thunder_timecloud=y' \
            > .config
          cat >> .config << 'DOTCONFIG'
          # ---- 网络加速（旁路由核心）----
          CONFIG_PACKAGE_kmod-tcp-bbr=y
          CONFIG_PACKAGE_kmod-nft-offload=y
          CONFIG_PACKAGE_kmod-nf-nathelper=y
          CONFIG_PACKAGE_kmod-crypto-hw-eip93=y
          CONFIG_PACKAGE_kmod-lib-zstd=y
          
          # ---- USB / 存储：下载宝本体就是存储盒 ----
          CONFIG_PACKAGE_kmod-usb-core=y
          CONFIG_PACKAGE_kmod-usb3=y
          CONFIG_PACKAGE_kmod-usb-xhci-mtk=y
          CONFIG_PACKAGE_kmod-usb-storage=y
          CONFIG_PACKAGE_kmod-usb-storage-uas=y
          CONFIG_PACKAGE_kmod-usb-storage-extras=y
          CONFIG_PACKAGE_kmod-mmc=y
          CONFIG_PACKAGE_kmod-sdhci=y
          CONFIG_PACKAGE_kmod-sdhci-mt7620=y
          CONFIG_PACKAGE_kmod-fs-ext4=y
          CONFIG_PACKAGE_kmod-fs-exfat=y
          CONFIG_PACKAGE_e2fsprogs=y
          CONFIG_PACKAGE_block-mount=y
          CONFIG_PACKAGE_fdisk=y
          CONFIG_PACKAGE_hdparm=y
          CONFIG_PACKAGE_smartmontools=y
          
          # ---- FWX 防火墙套件 ----
          CONFIG_PACKAGE_fwxd=y
          CONFIG_PACKAGE_kmod-fwx=y
          CONFIG_PACKAGE_libfwx_common=y
          CONFIG_PACKAGE_luci-app-fwx-app-center=y
          CONFIG_PACKAGE_luci-app-fwx-appfilter=y
          CONFIG_PACKAGE_luci-app-fwx-dashboard=y
          CONFIG_PACKAGE_luci-app-fwx-dashboard-setting=y
          CONFIG_PACKAGE_luci-app-fwx-feature=y
          CONFIG_PACKAGE_luci-app-fwx-firewall=y
          CONFIG_PACKAGE_luci-app-fwx-mac-blacklist=y
          CONFIG_PACKAGE_luci-app-fwx-macfilter=y
          CONFIG_PACKAGE_luci-app-fwx-network=y
          CONFIG_PACKAGE_luci-app-fwx-record=y
          CONFIG_PACKAGE_luci-app-fwx-record-whitelist=y
          CONFIG_PACKAGE_luci-app-fwx-resources=y
          CONFIG_PACKAGE_luci-app-fwx-session-stat=y
          CONFIG_PACKAGE_luci-app-fwx-system=y
          CONFIG_PACKAGE_luci-app-fwx-traffic-stat=y
          CONFIG_PACKAGE_luci-app-fwx-user=y
          CONFIG_PACKAGE_luci-app-fwx-user-record=y
          CONFIG_PACKAGE_luci-i18n-fwx-app-center-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-fwx-appfilter-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-fwx-dashboard-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-fwx-dashboard-setting-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-fwx-feature-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-fwx-firewall-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-fwx-mac-blacklist-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-fwx-macfilter-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-fwx-network-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-fwx-record-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-fwx-record-whitelist-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-fwx-session-stat-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-fwx-system-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-fwx-traffic-stat-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-fwx-user-zh-cn=y
          CONFIG_PACKAGE_luci-i18n-fwx-user-record-zh-cn=y
          
          # ---- 运维与中文 ----
          CONFIG_PACKAGE_htop=y
          CONFIG_PACKAGE_nano=y
          CONFIG_PACKAGE_curl=y
          CONFIG_PACKAGE_ttyd=y
          CONFIG_PACKAGE_luci-app-ttyd=y
          CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y
          CONFIG_PACKAGE_openssh-sftp-server=y
          CONFIG_PACKAGE_zram-swap=y
          CONFIG_PACKAGE_default-settings-chn=y
          CONFIG_PACKAGE_luci-i18n-base-zh-cn=y
          
          # ---- 精简：下载宝无 WiFi 硬件 ----
          CONFIG_PACKAGE_wpad-basic-mbedtls=n
          CONFIG_PACKAGE_wpad-openssl=n
          CONFIG_PACKAGE_hostapd=n
          CONFIG_PACKAGE_hostapd-common=n
          CONFIG_PACKAGE_kmod-cfg80211=n
          CONFIG_PACKAGE_kmod-mac80211=n
          CONFIG_PACKAGE_kmod-mt7603=n
          CONFIG_PACKAGE_kmod-mt76x2=n
          CONFIG_PACKAGE_luci-app-wireless=n
          CONFIG_PACKAGE_luci-proto-wireless=n
          DOTCONFIG
          # 只跑一次：跑两次会反向清除已选符号
          make defconfig

          echo '=== 目标设备 ==='
          grep -E '^CONFIG_TARGET_ramips_mt7621_DEVICE_thunder_timecloud=y$' .config && echo OK || { echo 目标未选中; exit 1; }

          echo '=== 关键包符号一致性 ==='
          for sym in CONFIG_PACKAGE_fwxd CONFIG_PACKAGE_kmod-fwx                CONFIG_PACKAGE_kmod-crypto-hw-eip93                CONFIG_PACKAGE_kmod-usb3 CONFIG_PACKAGE_kmod-sdhci-mt7620                CONFIG_PACKAGE_luci-app-ttyd CONFIG_PACKAGE_e2fsprogs                CONFIG_PACKAGE_zram-swap CONFIG_PACKAGE_block-mount; do
            grep -qE "^${sym}=y$" .config || { echo "MISSING $sym"; exit 1; }
          done

          echo '=== 无线组件 ==='
          grep -E '^CONFIG_PACKAGE_wpad.*=y|^CONFIG_PACKAGE_hostapd=y' .config && { echo 无线未清干净; exit 1; } || echo OK
          echo "选中包数量: $(grep -c '=y' .config)"

      - name: Download sources
        run: |
          make download -j4 V=s || make download -j2 V=s || make download -j1 V=s
          du -sh dl 2>/dev/null || true

      - name: Build
        if: ${{ env.CACHE_WARMUP != 'true' }}
        run: |
          make -j$(nproc) V=s 2>&1 | tee build.log
          echo '=== 产物 ==='
          ls -lh bin/targets/ramips/mt7621/ 2>/dev/null || true

      - name: Size guard
        if: ${{ env.CACHE_WARMUP != 'true' }}
        run: |
          python3 - << 'PY'
          import glob, os
          cands = glob.glob('bin/targets/ramips/mt7621/*.bin') + glob.glob('bin/targets/ramips/mt7621/*.img')
          syst = [f for f in cands if 'sysupgrade' in f]
          if not syst:
              print("!! 未找到 sysupgrade 镜像，请检查编译输出")
              raise SystemExit(1)
          for f in syst:
              sz = os.path.getsize(f) / 1024 / 1024
              print(f"{f}: {sz:.2f} MiB")
              if sz > 15.5:
                  print("❌ 超过 16MiB，16M flash 刷入必然变砖，请裁剪包")
                  raise SystemExit(1)
          print("✅ 体积安全")
          PY

      - name: Upload artifact
        if: ${{ env.CACHE_WARMUP != 'true' }}
        uses: actions/upload-artifact@v4.6.2
        with:
          name: timecloud-firmware
          path: |
            bin/targets/ramips/mt7621/*.bin
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: build-log
          path: build.log
          retention-days: 7

