name: Build FanchmWrt Timecloud
on:
  workflow_dispatch:
env:
  DEBIAN_FRONTEND: noninteractive
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib \
            gnutls-dev libelf-dev libssl-dev libncurses-dev libtool-bin \
            zlib1g-dev wget cpio unzip rsync file python3 python3-setuptools \
            device-tree-compiler libltdl-dev git curl ca-certificates

      - name: Clone FanchmWrt
        run: |
          git clone -b fanchmwrt-25.12.4 --depth 1 https://github.com/fanchmwrt/fanchmwrt.git .
          echo "--- 当前目录 ---"
          pwd && ls -la

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 注入旁路由自动配置脚本（uci-defaults）
        run: |
          mkdir -p files/etc/uci-defaults
          cat > files/etc/uci-defaults/99-setup-bypass-router << 'EOF'
#!/bin/sh
# 旁路由基础配置 - 首次启动自动执行一次，执行后自动标记完成
# IP: 192.168.1.111  网关/DNS: 192.168.1.1  关闭LAN口DHCP  关闭IPv6

# 1. 设置LAN口静态网络参数
uci set network.lan.proto='static'
uci set network.lan.ipaddr='192.168.1.111'
uci set network.lan.netmask='255.255.255.0'
uci set network.lan.gateway='192.168.1.1'
uci set network.lan.dns='192.168.1.1'

# 2. 完全关闭LAN口DHCP服务，避免与主路由冲突
uci set dhcp.lan.ignore='1'

# 3. 关闭IPv6（旁路由推荐，避免分流异常）
uci set network.lan.ipv6='0'
uci set dhcp.lan.dhcpv6='disabled'
uci set dhcp.lan.ra='disabled'

# 4. 提交配置永久生效
uci commit network
uci commit dhcp

exit 0
EOF
          chmod +x files/etc/uci-defaults/99-setup-bypass-router
          echo "=== 旁路由脚本已写入 ==="
          ls -l files/etc/uci-defaults/

      - name: Configure
        run: |
          # 1) 生成默认基础配置
          make defconfig

          # 2) 设置目标平台与设备
          echo 'CONFIG_TARGET_ramips=y' >> .config
          echo 'CONFIG_TARGET_ramips_mt7621=y' >> .config
          echo 'CONFIG_TARGET_ramips_mt7621_DEVICE_thunder_timecloud=y' >> .config

          # ========== 网络优化与硬件加速内核模块（旁路由必备） ==========
          echo 'CONFIG_PACKAGE_kmod-tcp-bbr=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-nft-offload=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-nf-nathelper=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-crypto-hw-eip93=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-lib-zstd=y' >> .config

          # ========== USB 与存储驱动全套 ==========
          echo 'CONFIG_PACKAGE_kmod-usb-core=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-usb3=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-usb-xhci-mtk=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-usb-storage=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-usb-storage-uas=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-usb-storage-extras=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-mmc=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-sdhci=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-sdhci-mt7620=y' >> .config

          # ========== FWX 防火墙增强套件（已剔除无线相关模块） ==========
          # 核心运行组件
          echo 'CONFIG_PACKAGE_fwxd=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-fwx=y' >> .config
          echo 'CONFIG_PACKAGE_libfwx_common=y' >> .config
          # 功能模块
          echo 'CONFIG_PACKAGE_luci-app-fwx-app-center=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-fwx-appfilter=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-fwx-dashboard=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-fwx-dashboard-setting=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-fwx-feature=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-fwx-firewall=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-fwx-mac-blacklist=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-fwx-macfilter=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-fwx-network=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-fwx-record=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-fwx-record-whitelist=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-fwx-resources=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-fwx-session-stat=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-fwx-system=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-fwx-traffic-stat=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-fwx-user=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-fwx-user-record=y' >> .config
          # 简体中文语言包
          echo 'CONFIG_PACKAGE_luci-i18n-fwx-app-center-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-fwx-appfilter-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-fwx-dashboard-setting-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-fwx-dashboard-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-fwx-feature-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-fwx-firewall-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-fwx-mac-blacklist-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-fwx-macfilter-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-fwx-network-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-fwx-record-whitelist-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-fwx-record-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-fwx-session-stat-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-fwx-system-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-fwx-traffic-stat-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-fwx-user-record-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-fwx-user-zh-cn=y' >> .config

          # ========== 常用运维工具 + 系统中文配置 ==========
          echo 'CONFIG_PACKAGE_htop=y' >> .config
          echo 'CONFIG_PACKAGE_nano=y' >> .config
          echo 'CONFIG_PACKAGE_curl=y' >> .config
          echo 'CONFIG_PACKAGE_ttyd=y' >> .config
          echo 'CONFIG_PACKAGE_luci-app-ttyd=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-ttyd-zh-cn=y' >> .config
          echo 'CONFIG_PACKAGE_openssh-sftp-server=y' >> .config
          echo 'CONFIG_PACKAGE_zram-swap=y' >> .config
          # 中文默认设置（时区、NTP、界面语言）
          echo 'CONFIG_PACKAGE_default-settings-chn=y' >> .config
          echo 'CONFIG_PACKAGE_luci-i18n-base-zh-cn=y' >> .config

          # ========== 文件系统与磁盘管理工具 ==========
          echo 'CONFIG_PACKAGE_kmod-fs-ext4=y' >> .config
          echo 'CONFIG_PACKAGE_kmod-fs-exfat=y' >> .config
          echo 'CONFIG_PACKAGE_e2fsprogs=y' >> .config
          echo 'CONFIG_PACKAGE_block-mount=y' >> .config
          echo 'CONFIG_PACKAGE_fdisk=y' >> .config
          echo 'CONFIG_PACKAGE_hdparm=y' >> .config
          echo 'CONFIG_PACKAGE_smartmontools=y' >> .config

          # ========== 精简：禁用所有WiFi/无线相关组件 ==========
          # 迅雷下载宝无WiFi硬件，全部为冗余，可省约1.3MB空间
          echo 'CONFIG_PACKAGE_wpad-basic-mbedtls=n' >> .config
          echo 'CONFIG_PACKAGE_wpad-openssl=n' >> .config
          echo 'CONFIG_PACKAGE_hostapd=n' >> .config
          echo 'CONFIG_PACKAGE_hostapd-common=n' >> .config
          echo 'CONFIG_PACKAGE_kmod-cfg80211=n' >> .config
          echo 'CONFIG_PACKAGE_kmod-mac80211=n' >> .config
          echo 'CONFIG_PACKAGE_kmod-mt7603=n' >> .config
          echo 'CONFIG_PACKAGE_kmod-mt76x2=n' >> .config
          echo 'CONFIG_PACKAGE_luci-app-wireless=n' >> .config
          echo 'CONFIG_PACKAGE_luci-proto-wireless=n' >> .config

          # 3) 展开所有依赖，补全完整配置
          make defconfig

          # 4) 配置校验
          echo "=== 目标设备校验 ==="
          grep -E '^CONFIG_TARGET_ramips_mt7621_DEVICE_thunder_timecloud=y$' .config \
            && echo "✅ 设备 thunder_timecloud 已正确选中" \
            || { echo "❌ 设备未选中，编译终止"; exit 1; }
          echo "=== 无线组件校验 ==="
          grep -E '^CONFIG_PACKAGE_wpad.*=y$' .config || echo "✅ wpad 已禁用"
          grep -E '^CONFIG_PACKAGE_hostapd=y$' .config || echo "✅ hostapd 已禁用"

      - name: Download
        run: |
          # 阶梯并发下载，失败自动重试，解决网络不稳定导致的下载失败
          make download -j4 V=s \
            || make download -j2 V=s \
            || make download -j1 V=s

      - name: Build
        run: make -j$(nproc) V=s

      - name: Upload
        uses: actions/upload-artifact@v4.4.3
        with:
          name: timecloud-firmware
          path: bin/targets/ramips/mt7621/*.bin
