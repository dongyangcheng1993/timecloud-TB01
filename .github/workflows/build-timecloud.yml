name: Build FanchmWrt Timecloud

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Clone FanchmWrt
        run: |
          git clone -b fanchmwrt-25.12.4 --depth 1 https://github.com/fanchmwrt/fanchmwrt.git .

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y build-essential clang flex bison g++ gawk \
            gcc-multilib gnutls-dev libelf-dev libssl-dev libncurses-dev \
            libtool-bin zlib1g-dev wget cpio unzip rsync file python3 python3-setuptools

      - name: Update and install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Configure
        run: |
          make defconfig
          echo "=== 列出所有 mt7621 子设备 config 符号 ==="
          grep -o 'CONFIG_TARGET_ramips_mt7621_[a-z0-9_]*' .config | sort -u
          echo "=== 尝试写入 timecloud ==="
          sed -i 's/^CONFIG_TARGET_ramips_mt7621_.*=y/# & is not set/' .config
          echo 'CONFIG_TARGET_RAMIPS_MT7621_THUNDER_TIMECLOUD=y' >> .config
          make defconfig
          echo "=== 验证 ==="
          grep -i "timecloud" .config || true
          grep "adslr" .config || echo "OK: adslr removed"

      - name: Download
        run: make download -j$(nproc)

      - name: Build
        run: make -j$(nproc) V=s

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: timecloud-firmware
          path: bin/targets/ramips/mt7621/*.bin
